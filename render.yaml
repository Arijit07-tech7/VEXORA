services:
  - type: web
    name: vexora
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    disk:
      name: vexora-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: VEXORA_DATA_DIR
        value: /var/data/vexora
      - key: VEXORA_UPLOADS_DIR
        value: /var/data/vexora/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BOOTSTRAP_ADMIN_ID
        value: ARIJIT
      - key: BOOTSTRAP_ADMIN_NAME
        value: Arijit
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
